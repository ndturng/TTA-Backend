services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: pks
      POSTGRES_PASSWORD: abc123!
      POSTGRES_DB: real_estate
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pks"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace          
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://pks:abc123%21@db:5432/real_estate
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

volumes:
  pgdata:
